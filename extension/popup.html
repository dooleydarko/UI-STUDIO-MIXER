<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Antigravity Code Mixer</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #090a0f;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .badge {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 11px;
      color: #000;
    }
    .title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .subtitle {
      font-size: 10px;
      color: #94a3b8;
    }
    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #1e2230;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #282e42;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: #000;
      border: none;
      font-weight: 700;
    }
    .btn-primary:hover {
      opacity: 0.95;
    }
    .status {
      margin-top: 10px;
      font-size: 11px;
      text-align: center;
      color: #38bdf8;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">AG</div>
    <div>
      <div class="title">Antigravity Code Mixer</div>
      <div class="subtitle">Quick Intake & Copier</div>
    </div>
  </div>

  <button id="btnCopyPage" class="btn btn-primary">
    <span>⚡</span>
    <span>Copy Current Page Code</span>
  </button>

  <button id="btnOpenStudio" class="btn">
    <span>🚀</span>
    <span>Open Studio (localhost:5173)</span>
  </button>

  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
