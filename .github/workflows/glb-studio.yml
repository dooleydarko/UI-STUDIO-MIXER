name: GLB Studio checks
on:
  pull_request:
    paths:
      - 'src/studio3d/**'
      - 'tests/glbStudio.test.mjs'
      - '.github/workflows/glb-studio.yml'
      - 'package*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node --test tests/glbStudio.test.mjs
